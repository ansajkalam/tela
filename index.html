<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Real Image Alphabet</title>
    <link rel="stylesheet" href="styles.css?v=coffee-support">
  </head>
  <body>
    <main class="app">
      <section class="name-stage" aria-label="Name preview">
        <div id="tileRow" class="tile-row" aria-live="polite"></div>
        <div id="mobileContext" class="mobile-context" hidden></div>
      </section>

      <section class="input-panel" aria-label="Name input">
        <label for="nameInput">Enter a name</label>
        <div class="input-row">
          <input id="nameInput" type="text" autocomplete="off" spellcheck="false" maxlength="28" autofocus>
          <button id="shuffleButton" class="icon-button" type="button" title="Reload variation" aria-label="Reload variation">Reload</button>
        </div>
        <button id="saveButton" class="save-button" type="button">Save Design</button>
        <a class="coffee-button" href="https://www.buymeacoffee.com/crisisforum" target="_blank" rel="noopener noreferrer" aria-label="Buy me a coffee">
          <img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png" alt="Buy Me a Coffee">
        </a>
      </section>
    </main>

    <script defer src="/_vercel/insights/script.js"></script>
    <script src="app.js?v=mobile-context-2"></script>
  </body>
</html>
